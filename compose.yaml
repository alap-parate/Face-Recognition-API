services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gops-face-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}

volumes:
  qdrant_storage:
